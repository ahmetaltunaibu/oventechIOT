{% extends "base.html" %}
{% block title %}Giriş - OventechIOT{% endblock %}
{% block content %}
<div style="max-width:380px;margin:60px auto 0;">
    <div class="card">
        <h2 style="text-align:center;font-size:20px;margin-bottom:20px;">⚙️ OventechIOT Giriş</h2>
        <form method="POST" onsubmit="const b=this.querySelector('button');b.disabled=true;b.textContent='Giriş yapılıyor…';">
            <label>Kullanıcı Adı</label>
            <input type="text" name="kullanici_adi" required autocomplete="off">
            <label>Şifre</label>
            <input type="password" name="sifre" required>
            <button type="submit" style="width:100%;margin-top:8px;">Giriş Yap</button>
        </form>
    </div>
    <p style="text-align:center;font-size:12px;color:var(--text-secondary);margin-top:14px;">
        Platform yöneticisi misiniz? <a class="item-link" href="{{ url_for('admin.admin_login') }}" style="color:var(--accent);">Admin girişi</a>
    </p>
</div>
{% endblock %}

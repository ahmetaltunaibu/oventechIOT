{% extends "base.html" %}
{% block title %}İlk Kurulum - OventechIOT{% endblock %}
{% block content %}
<div style="max-width:420px;margin:40px auto 0;">
    <div class="card">
        <h2 style="text-align:center;font-size:20px;margin-bottom:6px;">⚙️ İlk Kurulum</h2>
        <p style="text-align:center;font-size:12px;color:var(--text-secondary);margin-bottom:20px;">
            İlk proje ve tasarımcı kullanıcıyı oluştur. Bu sayfa oluşturulduktan sonra kendini kilitler.
        </p>
        <form method="POST">
            <label>Proje Kodu (girişte kullanılacak, örn. oventech)</label>
            <input type="text" name="proje_kodu" required autocomplete="off">
            <label>Proje/Müşteri Adı</label>
            <input type="text" name="proje_ad" placeholder="örn. Oventech Test" required>
            <label>Kullanıcı Adı</label>
            <input type="text" name="kullanici_adi" required autocomplete="off">
            <label>Şifre</label>
            <input type="password" name="sifre" required>
            <label>Ad Soyad</label>
            <input type="text" name="ad_soyad" required>
            <button type="submit" style="width:100%;margin-top:8px;">Kurulumu Tamamla</button>
        </form>
    </div>
</div>
{% endblock %}

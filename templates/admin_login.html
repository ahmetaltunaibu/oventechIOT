{% extends "base.html" %}
{% block title %}Admin Giriş - OventechIOT{% endblock %}
{% block content %}
<div style="max-width:380px;margin:60px auto 0;">
    <div class="card">
        <h2 style="text-align:center;font-size:20px;margin-bottom:20px;">🛠️ Platform Yöneticisi Girişi</h2>
        <form method="POST">
            <label>Kullanıcı Adı</label>
            <input type="text" name="kullanici_adi" required autocomplete="off">
            <label>Şifre</label>
            <input type="password" name="sifre" required>
            <button type="submit" style="width:100%;margin-top:8px;">Giriş Yap</button>
        </form>
    </div>
    <p style="text-align:center;font-size:12px;color:var(--text-secondary);margin-top:14px;">
        Proje kullanıcısı mısınız? <a class="item-link" href="{{ url_for('login.login_page') }}" style="color:var(--accent);">Normal giriş</a>
    </p>
</div>
{% endblock %}
